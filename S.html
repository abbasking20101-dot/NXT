<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMER KING VIP - Ultimate Login</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 15px; background: #000; color: #fff; overflow-x: hidden; position: relative;
        }
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -2; pointer-events: none;
        }
        .bg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.05); z-index: -1; }
        
        /* Responsive Login Card */
        #loginWrapper {
            background: rgba(255,255,255,0.02); backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px); border: 1px solid rgba(255,255,255,0.18);
            border-radius: 22px; padding: 20px; width: 100%; max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; z-index: 10;
        }
        /* Main App Dashboard */
        #appContent {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 999; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px;
        }

        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .control-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 6px 10px; border-radius: 9px; font-size: 11px; font-weight: 700; cursor: pointer; z-index: 20;
        }
        .control-btn:hover { background: rgba(255,255,255,0.15); }
        .video-dropdown {
            display: none; position: absolute; top: 58px; left: 20px; width: 200px;
            background: rgba(10,10,10,0.9); backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; overflow: hidden; z-index: 100;
        }
        .video-dropdown button {
            width: 100%; padding: 10px 12px; background: none; border: none;
            border-bottom: 1px solid rgba(255,255,255,0.08); color: #fff; text-align: left; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .video-dropdown button:hover { background: rgba(255,255,255,0.12); }
        
        h2 { text-align: center; font-size: 24px; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 4px; color: rgba(255,255,255,0.95); text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
        .subtitle { text-align: center; font-size: 11px; color: rgba(255,255,255,0.75); margin-bottom: 18px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
        
        input {
            width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.22); border-radius: 11px; color: #fff;
            font-size: 14px; font-weight: 700; letter-spacing: 1px; outline: none; text-align: center; text-transform: uppercase;
        }
        input::placeholder { color: rgba(255,255,255,0.4); text-transform: none; letter-spacing: 0; }
        input:focus { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.08); }
        
        .login-btn {
            width: 100%; padding: 12px; margin-top: 14px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 11px; color: #fff; font-size: 14px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
        }
        .login-btn:hover { background: rgba(255,255,255,0.25); }
        #loginMsg { text-align: center; margin-top: 12px; font-size: 12px; font-weight: 700; min-height: 20px; }
    </style>
</head>

<body>

    <video id="bgVideo" autoplay loop muted playsinline preload="auto" class="bg-video">
        <source src="https://github.com/abbasking20101-dot/NXT/raw/refs/heads/main/Video-54546.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <!-- Login Screen -->
    <div id="loginWrapper" class="login-card">
        <div class="top-controls">
            <button class="control-btn" onclick="toggleVideoMenu(event)">🎬 Change Video ▾</button>
            <button id="soundBtn" class="control-btn" onclick="toggleVideoSound()">🔊 Sound: ON</button>
        </div>

        <div id="videoDropdown" class="video-dropdown"></div>

        <h2>GAMER KING VIP</h2>
        <div class="subtitle">Enter your License Key to Access</div>

        <label>License Key:</label>
        <input type="text" id="licenseKeyInput" placeholder="e.g. GK-AB12CD-3456">

        <button class="login-btn" onclick="verifyLicenseKey()">🔑 VERIFY & LOGIN</button>
        <div id="loginMsg"></div>
    </div>

    <!-- Main App Content -->
    <div id="appContent">
        <h1 style="color: #4ade80; margin-bottom: 12px; font-size: 22px;">🚀 WELCOME TO GAMER KING VIP</h1>
        <p style="font-size: 13px; color: #ddd; margin-bottom: 20px;">Your license is active and running successfully!</p>
        <button class="login-btn" style="max-width: 160px; background: rgba(239, 68, 68, 0.35);" onclick="logoutApp()">🚪 Logout</button>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://gamer-king-72dd9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    const videoPlaylist = [
        { name: "🎬 Video 1 (Default)", url: "https://github.com/abbasking20101-dot/NXT/raw/refs/heads/main/Video-54546.mp4" },
        { name: "🎬 Video 2", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/Video-70965.mp4" },
        { name: "🎬 Video 3", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/Fonk%20song%20%F0%9F%8E%B5%20%F0%9F%91%BF%F0%9F%98%88%F0%9F%92%80%F0%9F%91%BF.mp4" },
        { name: "🎬 Video 4", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/%F0%9F%8E%A7%20--%20GETA%20ONLY%20--%20SLOWED%20--%20%23avee_player%20%20%23%20phonk%20%23funk%20%23sllicx%20ENGLISH%F0%9F%8E%B5%20Rate%20the%20song-%20-10%F0%9F%94%A5%20.mp4" },
        { name: "🎬 Video 5", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/M4%20on%207eleven%20Sen%20de%20bu%20tarz%20editler%20yapmak%20istiyorsan%20UmutcanFx%20ve%20Academy%E2%80%99e%20biomdan%20g%C3%B6z%20atabil.mp4" }
    ];

    window.onload = function() {
        const dropdown = document.getElementById('videoDropdown');
        const bgVid = document.getElementById('bgVideo');
        const soundBtn = document.getElementById('soundBtn');

        // Initial check & every 1 second live validation loop
        checkSavedSession();
        setInterval(checkSavedSession, 1000); // ⏱️ Har 1 second check

        videoPlaylist.forEach((vid) => {
            const btn = document.createElement('button');
            btn.innerText = vid.name;
            btn.onclick = async () => {
                bgVid.src = vid.url;
                bgVid.load();
                try {
                    await bgVid.play();
                    bgVid.muted = false;
                    soundBtn.innerText = "🔊 Sound: ON";
                } catch (error) {
                    soundBtn.innerText = "🔇 Tap for Sound";
                }
                dropdown.style.display = 'none';
            };
            dropdown.appendChild(btn);
        });

        bgVid.muted = true;
        bgVid.play().catch(() => {});

        setTimeout(async () => {
            try {
                bgVid.muted = false;
                await bgVid.play();
                soundBtn.innerText = "🔊 Sound: ON";
            } catch (error) {
                bgVid.muted = true;
                soundBtn.innerText = "🔇 Tap for Sound";
            }
        }, 1500);
    };

    // HAR 1 SECOND CHECKER (Auto-kick on expiry/ban)
    function checkSavedSession() {
        const savedKey = localStorage.getItem('gk_logged_key');
        if (!savedKey) return;

        db.ref(`licenses/${savedKey}`).once('value').then(snapshot => {
            if (!snapshot.exists()) {
                forceLogout("❌ Key deleted or invalid!");
                return;
            }

            const data = snapshot.val();
            const now = Date.now();

            if (data.status === "banned") {
                forceLogout("🚫 Your Key has been BANNED!");
            } else if (data.expiresAt && data.expiresAt > 0 && now >= data.expiresAt) {
                db.ref(`licenses/${savedKey}`).update({ status: "expired" });
                forceLogout("🔴 Key Expired! Time Over.");
            } else {
                // Key valid hai toh app khuli rahegi
                document.getElementById('loginWrapper').style.display = 'none';
                document.getElementById('appContent').style.display = 'flex';
            }
        });
    }

    function forceLogout(reason) {
        localStorage.removeItem('gk_logged_key');
        document.getElementById('appContent').style.display = 'none';
        document.getElementById('loginWrapper').style.display = 'block';
        const msg = document.getElementById('loginMsg');
        msg.style.color = "#f87171";
        msg.innerText = reason;
    }

    function logoutApp() {
        localStorage.removeItem('gk_logged_key');
        document.getElementById('appContent').style.display = 'none';
        document.getElementById('loginWrapper').style.display = 'block';
        document.getElementById('licenseKeyInput').value = '';
        document.getElementById('loginMsg').innerText = "🔒 Logged out successfully.";
    }

    function toggleVideoMenu(e) {
        e.stopPropagation();
        const d = document.getElementById('videoDropdown');
        d.style.display = d.style.display === 'block' ? 'none' : 'block';
    }

    function toggleVideoSound() {
        const v = document.getElementById('bgVideo');
        const b = document.getElementById('soundBtn');
        v.muted = !v.muted;
        if (!v.muted) v.play().catch(() => {});
        b.innerText = v.muted ? "🔇 Sound: OFF" : "🔊 Sound: ON";
    }

    window.onclick = (e) => {
        if (!e.target.closest('.top-controls')) {
            document.getElementById('videoDropdown').style.display = 'none';
        }
    };

    function getDeviceId() {
        let devId = localStorage.getItem('gk_device_id');
        if (!devId) {
            devId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem('gk_device_id', devId);
        }
        return devId;
    }

    function verifyLicenseKey() {
        const keyInput = document.getElementById('licenseKeyInput').value.trim().toUpperCase();
        const msg = document.getElementById('loginMsg');

        if (!keyInput) {
            msg.style.color = "#f87171";
            msg.innerText = "❌ Please enter a License Key!";
            return;
        }

        msg.style.color = "#fbbf24";
        msg.innerText = "⏳ Checking Key on Server...";

        db.ref(`licenses/${keyInput}`).once('value').then(snapshot => {
            if (!snapshot.exists()) {
                msg.style.color = "#f87171";
                msg.innerText = "❌ Invalid Key! Key does not exist.";
                return;
            }

            const data = snapshot.val();
            const now = Date.now();
            const currentDevice = getDeviceId();

            if (data.status === "banned") {
                msg.style.color = "#f87171";
                msg.innerText = "🚫 This Key has been BANNED by Admin!";
                return;
            }

            if (data.expiresAt && data.expiresAt > 0 && now >= data.expiresAt) {
                db.ref(`licenses/${keyInput}`).update({ status: "expired" });
                msg.style.color = "#f87171";
                msg.innerText = "🔴 Key Expired! Contact Admin for a new key.";
                return;
            }

            let devices = data.devices || {};
            let deviceCount = Object.keys(devices).length;
            let deviceLimit = data.deviceLimit || 1;

            if (!devices[currentDevice]) {
                if (deviceCount >= deviceLimit) {
                    msg.style.color = "#f87171";
                    msg.innerText = `⚠️ Device limit reached! Max allowed devices: ${deviceLimit}`;
                    return;
                }
                devices[currentDevice] = now;
            }

            let updates = { status: "used", lastLogin: now, devices: devices };

            if (!data.startedAt || data.startedAt === 0) {
                updates.startedAt = now;
                if (!data.expiresAt || data.expiresAt === 0) {
                    let durationMs = (data.duration || 1) * 60 * 60 * 1000;
                    if (data.durationUnit === "minutes") durationMs = data.duration * 60 * 1000;
                    if (data.durationUnit === "days") durationMs = data.duration * 24 * 60 * 60 * 1000;
                    updates.expiresAt = now + durationMs;
                }
            }

            db.ref(`licenses/${keyInput}`).update(updates).then(() => {
                localStorage.setItem('gk_logged_key', keyInput);
                msg.style.color = "#4ade80";
                msg.innerText = "✅ Access Granted! Opening Dashboard...";
                setTimeout(() => {
                    document.getElementById('loginWrapper').style.display = 'none';
                    document.getElementById('appContent').style.display = 'flex';
                }, 600);
            });
        }).catch(() => {
            msg.style.color = "#f87171";
            msg.innerText = "❌ Network Error! Try again.";
        });
    }
</script>
</body>
</html>
